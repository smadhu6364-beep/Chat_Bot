name: Android build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # AGP 7.2 / Gradle 7.3 need JDK 11
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
      # The runner image ships the Android SDK (ANDROID_HOME); AGP fetches platform 32 itself
      - run: chmod +x gradlew
      - run: ./gradlew --no-daemon assembleDebug testDebugUnitTest
